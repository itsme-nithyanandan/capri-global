<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payout — Capri Global</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:block;min-height:100vh;padding:20px}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
  <div>
    <div style="font-size:16px;font-weight:600">Payout</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px">Payout earned on disbursed cases, by bank payout %</div>
  </div>
  <button class="btn btn-sm" onclick="exportPayoutCSV()"><i class="ti ti-download" style="font-size:12px"></i> Export CSV</button>
  <button class="btn btn-sm" id="payout-refresh-btn" onclick="refreshPayoutData()" title="Reload payout data" style="margin-left:8px;color:var(--muted)">
    <i class="ti ti-reload" style="font-size:12px" id="payout-refresh-icon"></i>
  </button>
</div>

<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
  <input class="filter-input" id="payout-search" placeholder="Search case ID, customer..." style="width:220px" oninput="renderPayoutTable()">
  <select class="filter-select" id="payout-period" onchange="renderPayoutTable()"></select>
  <select class="filter-select" id="payout-member" onchange="renderPayoutTable()"><option value="all">All members</option></select>
  <button class="btn btn-sm" onclick="resetPayoutFilters()"><i class="ti ti-refresh" style="font-size:12px"></i> Reset</button>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">
  <div class="kpi" style="padding:14px 16px">
    <div class="kpi-label">Disbursed cases</div>
    <div class="kpi-value" style="font-size:22px" id="kpi-case-count">—</div>
  </div>
  <div class="kpi" style="padding:14px 16px">
    <div class="kpi-label">Total disbursed amount</div>
    <div class="kpi-value" style="font-size:20px" id="kpi-disbursed-total">—</div>
  </div>
  <div class="kpi" style="padding:14px 16px;border-color:var(--green-border)">
    <div class="kpi-label">Total payout</div>
    <div class="kpi-value" style="font-size:20px;color:var(--green-text)" id="kpi-payout-total">—</div>
  </div>
</div>

<div class="card">
  <table class="data-table has-mlist">
    <thead><tr>
      <th>Case ID</th><th>Customer</th><th>Bank</th><th>Member</th>
      <th>Disbursed Amount</th><th>Payout %</th><th>Payout Amount</th><th>Status</th><th>Action</th>
    </tr></thead>
    <tbody id="payout-tbody"><tr><td colspan="9"><div class="empty-state" style="padding:24px"><i class="ti ti-table-off"></i><span>Loading...</span></div></td></tr></tbody>
  </table>
  <div class="mlist" id="payout-mlist"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script src="payout-report.js"></script>
</body>
</html>
