<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — Capri Global</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A4F3A">
<link rel="apple-touch-icon" href="appletouchicon.png">
<link rel="icon" type="image/png" href="icon192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri Global">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:block;min-height:100vh;padding:20px}
</style>
</head>
<body>

<div style="margin-bottom:16px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <button onclick="toggleDashFilters()" id="filter-toggle-btn"
      style="display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text);transition:all .15s;box-shadow:var(--shadow-sm)">
      <i class="ti ti-filter" style="font-size:14px;color:var(--muted)"></i>
      Filters
      <span id="dash-filter-badge" style="display:none;background:var(--accent);color:white;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px">0</span>
      <i class="ti ti-chevron-down" id="filter-chevron" style="font-size:12px;color:var(--muted);transition:transform .2s"></i>
    </button>
    <button class="btn btn-sm" onclick="resetDashFilters()" style="color:var(--muted)">
      <i class="ti ti-refresh" style="font-size:12px"></i> Reset
    </button>
    <button class="btn btn-sm" id="dash-refresh-btn" onclick="refreshOverviewData()" title="Reload dashboard data" style="color:var(--muted)">
      <i class="ti ti-reload" style="font-size:12px" id="dash-refresh-icon"></i>
    </button>
  </div>
  <div id="dash-filter-panel" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
      <div style="display:flex;flex-direction:column;gap:4px">
        <label style="font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase">Finance Institute</label>
        <select class="filter-select" id="dash-bank-filter" onchange="applyDashFilters()" style="font-size:12.5px;padding:6px 10px;min-width:150px">
          <option value="">All Banks / NBFCs</option>
        </select>
      </div>
      <div id="bm-filter-wrap" style="display:flex;flex-direction:column;gap:4px">
        <label style="font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase">BM</label>
        <select class="filter-select" id="dash-bm-filter" onchange="onBMChange()" style="font-size:12.5px;padding:6px 10px;min-width:130px">
          <option value="">All BMs</option>
        </select>
      </div>
      <div id="rm-filter-wrap" style="display:flex;flex-direction:column;gap:4px">
        <label style="font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase">RM</label>
        <select class="filter-select" id="dash-rm-filter" onchange="applyDashFilters()" style="font-size:12.5px;padding:6px 10px;min-width:140px" disabled="">
          <option value="">— Select BM first —</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <label style="font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase">Period</label>
        <select class="filter-select" id="dash-period-select" onchange="setPeriod(this.value)" style="font-size:12.5px;padding:6px 10px;min-width:180px">
          <option value="" selected disabled>Select Period</option>
          <option value="today">Today</option><option value="thisweek">This Week</option><option value="lastweek">Last Week</option>
          <option disabled>────────</option>
          <option value="fy">FY 2026–27</option>
          <option disabled>────────</option>
          <option value="q1">Q1 Apr–Jun</option><option value="q2">Q2 Jul–Sep</option><option value="q3">Q3 Oct–Dec</option><option value="q4">Q4 Jan–Mar</option>
          <option disabled>────────</option>
          <option value="h1">H1 Apr–Sep</option><option value="h2">H2 Oct–Mar</option>
          <option disabled>────────</option>
          <option value="custom">Custom Range…</option>
        </select>
      </div>
      <div id="custom-range-wrap" style="display:none;flex-direction:column;gap:4px">
        <label style="font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase">Custom Range</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="date" id="dash-date-from" class="filter-input" onchange="applyDashFilters()" style="font-size:12px;padding:6px 9px;width:132px">
          <span style="font-size:11px;color:var(--muted2)">→</span>
          <input type="date" id="dash-date-to" class="filter-input" onchange="applyDashFilters()" style="font-size:12px;padding:6px 9px;width:132px">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="kpi-grid" style="display:grid;grid-template-columns:repeat(8,1fr);gap:13px;margin-bottom:18px">

  <div class="kpi">
    <div class="kpi-icon" style="background:var(--green-bg);color:var(--green-text)"><i class="ti ti-files"></i></div>
    <div class="kpi-label">Total Files — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:var(--accent)" id="kpi-files">—</div>
    <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px" id="kpi-files-val">—</div>
    <div class="kpi-sub"><span class="trend-up"><i class="ti ti-trending-up" style="font-size:11px"></i> vs last period</span></div>
  </div>

  <div class="kpi" style="border-color:var(--blue-border);background:linear-gradient(145deg,#EFF6FF 0%,#DBEAFE 100%)">
    <div style="position:absolute;right:-16px;bottom:-16px;width:72px;height:72px;border-radius:50%;background:rgba(26,58,138,.06)"></div>
    <div class="kpi-icon" style="background:#BFDBFE;color:var(--blue-text)"><i class="ti ti-login"></i></div>
    <div class="kpi-label" style="color:var(--blue-text)">Logged In — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:var(--blue-text)" id="kpi-loggedin">—</div>
    <div style="font-size:11px;font-weight:600;color:var(--blue-text);margin-bottom:4px" id="kpi-loggedin-val">—</div>
    <div class="kpi-sub" style="color:var(--blue-text)"><span style="color:var(--blue-text)">Yet to move to processing</span></div>
  </div>

  <div class="kpi" style="border-color:var(--amber-border);background:linear-gradient(145deg,#FFFBEB 0%,#FEF3C7 100%)">
    <div style="position:absolute;right:-16px;bottom:-16px;width:72px;height:72px;border-radius:50%;background:rgba(139,74,12,.06)"></div>
    <div class="kpi-icon" style="background:#FDE68A;color:var(--amber-text)"><i class="ti ti-loader"></i></div>
    <div class="kpi-label" style="color:var(--amber-text)">In Process — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:var(--amber-text)" id="kpi-inprocess">—</div>
    <div style="font-size:11px;font-weight:600;color:var(--amber-text);margin-bottom:4px" id="kpi-inprocess-val">—</div>
    <div class="kpi-sub" style="color:var(--amber-text)"><i class="ti ti-trending-up" style="font-size:11px"></i> vs last period</div>
  </div>

  <div class="kpi">
    <div class="kpi-icon" style="background:var(--green-bg);color:var(--green-text)"><i class="ti ti-check"></i></div>
    <div class="kpi-label">Sanctioned — Awaiting Disbursal</div>
    <div class="kpi-value" style="color:var(--green-text)" id="kpi-sanc">—</div>
    <div style="font-size:11px;font-weight:600;color:var(--green-text);margin-bottom:4px" id="kpi-sanc-val">—</div>
    <div class="kpi-sub"><span style="color:var(--muted)">Cases yet to be disbursed</span></div>
  </div>

  <div class="kpi" style="border-color:#A7F3D0;background:linear-gradient(145deg,#F0FDF4 0%,#DCFCE7 100%)">
    <div style="position:absolute;right:-16px;bottom:-16px;width:72px;height:72px;border-radius:50%;background:rgba(21,94,53,.07)"></div>
    <div class="kpi-icon" style="background:#BBF7D0;color:#166534"><i class="ti ti-circle-check"></i></div>
    <div class="kpi-label" style="color:#166534">Disbursements — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:#166534" id="disb-count">—</div>
    <div style="font-size:11px;font-weight:600;color:#166534;margin-bottom:4px" id="disb-amount">—</div>
    <div class="kpi-sub" style="color:#166534"><i class="ti ti-trending-up" style="font-size:11px"></i> vs last period</div>
  </div>

  <div class="kpi" style="border-color:var(--amber-border);background:linear-gradient(145deg,#FFFBEB 0%,#FEF3C7 100%)">
    <div style="position:absolute;right:-16px;bottom:-16px;width:72px;height:72px;border-radius:50%;background:rgba(139,74,12,.06)"></div>
    <div class="kpi-icon" style="background:#FDE68A;color:var(--amber-text)"><i class="ti ti-file-certificate"></i></div>
    <div class="kpi-label" style="color:var(--amber-text)">PDD Pending</div>
    <div class="kpi-value" style="color:var(--amber-text)" id="kpi-pdd-pending">—</div>
    <div class="kpi-sub" style="color:var(--amber-text)" id="kpi-pdd-pending-sub">—</div>
  </div>

  <div class="kpi" style="border-color:var(--red-border);background:linear-gradient(145deg,#FFF5F5 0%,#FEE8E8 100%)">
    <div style="position:absolute;right:-16px;bottom:-16px;width:72px;height:72px;border-radius:50%;background:rgba(178,28,28,.05)"></div>
    <div class="kpi-icon" style="background:#FECACA;color:var(--red-text)"><i class="ti ti-circle-x"></i></div>
    <div class="kpi-label" style="color:var(--red-text)">Rejected — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:var(--red-text)" id="kpi-rejected">—</div>
    <div style="font-size:11px;font-weight:600;color:var(--red-text);margin-bottom:4px" id="kpi-rejected-val">—</div>
    <div class="kpi-sub" style="color:var(--red-text)" id="kpi-rejected-rate"></div>
  </div>

  <div class="kpi">
    <div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple-text)"><i class="ti ti-cash"></i></div>
    <div class="kpi-label">Total Payout — <span class="kpi-period-label">May</span></div>
    <div class="kpi-value" style="color:var(--purple-text);font-size:22px" id="kpi-payout-val">—</div>
    <div class="kpi-sub"><span class="trend-up"><i class="ti ti-trending-up" style="font-size:11px"></i> vs last period</span></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script src="overview.js"></script>
</body>
</html>
