<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Users — Capri Global</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:block;min-height:100vh;padding:20px}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <div>
    <div style="font-size:16px;font-weight:600">Users</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px">Create users and assign roles · tab access is in User Configuration</div>
  </div>
  <button class="btn btn-primary" onclick="openUserModal()">
    <i class="ti ti-plus" style="font-size:13px"></i> Add user
  </button>
</div>

<div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
  <input id="users-search" type="text" placeholder="Search name, email, phone…" class="filter-input" style="flex:1;min-width:220px;padding:8px 12px;font-size:13px" oninput="renderUsersList()">
  <select id="users-role-filter" class="filter-select" style="padding:8px 12px;font-size:13px" onchange="renderUsersList()">
    <option value="">All roles</option>
    <option value="city_head">City Head</option>
    <option value="bm">Branch Manager</option>
    <option value="rm">Relationship Manager</option>
  </select>
</div>

<div id="users-list-container" style="overflow-x:auto">
  <div style="text-align:center;padding:40px;color:var(--muted)">
    <i class="ti ti-loader" style="font-size:24px;display:block;margin-bottom:8px"></i>
    Loading users...
  </div>
</div>

<div class="modal-overlay" id="user-modal-overlay" onclick="closeUserModal()" style="display:none">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:460px;width:100%">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:15px;font-weight:600" id="user-modal-title">Add User</div>
      <button onclick="closeUserModal()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)"><i class="ti ti-x"></i></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Full Name</label>
        <input id="um-name" type="text" placeholder="e.g. Karthik M" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Email</label>
        <input id="um-email" type="email" placeholder="name@capriglobal.in" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Phone</label>
        <input id="um-phone" type="tel" placeholder="9876543210" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Role</label>
        <select id="um-role" class="filter-select" style="width:100%;padding:9px 12px;font-size:13px" onchange="onUserRoleChange()">
          <option value="">Select role</option>
          <option value="city_head">City Head</option>
          <option value="bm">Branch Manager (BM)</option>
          <option value="rm">Relationship Manager (RM)</option>
        </select>
      </div>
      <div id="um-reports-wrap" style="display:none">
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Reports To</label>
        <select id="um-reports-to" class="filter-select" style="width:100%;padding:9px 12px;font-size:13px">
          <option value="">Select manager</option>
        </select>
      </div>
      <div id="um-target-wrap" style="display:none">
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Monthly File Target</label>
        <input id="um-target" type="number" min="0" placeholder="e.g. 8" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
      </div>
      <div id="um-password-wrap">
        <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">Password <span style="color:var(--red-text)">*</span></label>
        <input id="um-password" type="password" placeholder="Min 8 characters" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
        <div style="font-size:11px;color:var(--muted);margin-top:4px">User can change this after first login</div>
      </div>

      <div id="um-reset-pw-wrap" style="display:none">
        <div id="um-reset-pw-toggle" style="font-size:12px;color:var(--accent);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;user-select:none" onclick="toggleResetPasswordField()">
          <i class="ti ti-key" style="font-size:13px"></i> Reset password
        </div>
        <div id="um-reset-pw-fields" style="display:none;margin-top:10px">
          <label style="font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">New Password</label>
          <input id="um-new-password" type="password" placeholder="Min 8 characters" class="filter-input" style="width:100%;padding:9px 12px;font-size:13px">
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-sm" type="button" onclick="toggleResetPasswordField()">Cancel</button>
            <button class="btn btn-sm btn-primary" type="button" id="um-reset-pw-btn" onclick="resetUserPassword()">
              <i class="ti ti-check" style="font-size:12px"></i> Update password
            </button>
          </div>
          <div id="um-reset-pw-error" style="display:none;margin-top:8px;padding:8px 12px;background:var(--red-bg);border-radius:8px;font-size:11px;color:var(--red-text)"></div>
        </div>
      </div>
    </div>

    <div id="um-error" style="display:none;margin-top:12px;padding:10px 14px;background:var(--red-bg);border-radius:8px;font-size:12px;color:var(--red-text)"></div>

    <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end">
      <button class="btn" onclick="closeUserModal()">Cancel</button>
      <button class="btn btn-primary" id="um-save-btn" onclick="saveUser()">
        <i class="ti ti-check" style="font-size:13px"></i> Create user
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script src="users.js"></script>
</body>
</html>
